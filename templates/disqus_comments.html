{% load static %}
<!-- ONLINE-COMMENTS:START -->
<style>#comments iframe {float:none;min-width:0;max-width:100%;} #comments button {min-height:44px;padding:8px 16px;} #comments [hidden] {display:none;}</style>
<section id="comments" aria-labelledby="comments-title" style="clear:both;max-width:960px;margin:32px auto;padding:16px;box-sizing:border-box">
    <h2 id="comments-title">積木使用交流</h2>
    <p>這裡保留以前的留言與回覆，也歡迎提出新的問題。載入後由 Disqus 提供留言服務，可能顯示廣告；發言需要登入。</p>
    <button id="comments-load" type="button" aria-controls="disqus_thread">載入留言</button>
    <p id="comments-status" role="status" aria-live="polite"></p>
    <div id="disqus_thread"></div>
    <p><a href="https://disqus.com/home/discussion/ahkcompiler/ahk_hackmd_66/" target="_blank" rel="noopener noreferrer">在 Disqus 查看原討論串</a></p>
    <noscript>請啟用 JavaScript，或使用上方連結閱讀留言。</noscript>
</section>
<script src="{% static 'comments.js' %}" defer></script>
<!-- ONLINE-COMMENTS:END -->
